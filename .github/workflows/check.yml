name: Check

on:
  push:
    branches: [main]
    paths:
      - scripts/**
      - startups/**
      - tests/**
      - tools/**
      - eslint.config.js
      - eslint.ci.config.js
      - jsconfig.json
      - package.json
      - .github/workflows/check.yml
  pull_request:
    paths:
      - scripts/**
      - startups/**
      - tests/**
      - tools/**
      - eslint.config.js
      - eslint.ci.config.js
      - jsconfig.json
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Bug-detection rules only. Formatting is the author's call, see eslint.ci.config.js.
      # The convention audit and tsc ratchet stay local: tools/ is gitignored.
      - name: Lint
        run: npm run lint:ci
